<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitantes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Visitantes</h1>
    </header>
    <main>
        <section class="conteudo">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do visitante">
            </div>
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="Digite o CPF do visitante">
            </div>
            <div class="form-group">
                <label for="data-entrada">Data de Entrada:</label>
                <input type="date" id="data-entrada" name="data-entrada">
            </div>
            <div class="form-group">
                <label for="hora-entrada">Hora de Entrada:</label>
                <input type="time" id="hora-entrada" name="hora-entrada">
            </div>
            <div class="form-group">
                <label for="data-saida">Data de Saída:</label>
                <input type="date" id="data-saida" name="data-saida">
            </div>
            <div class "form-group">
                <label for "hora-saida">Hora de Saída:</label>
                <input type "time" id "hora-saida" name "hora-saida">
            </div>
        </section>
    </main>
</body>
</html>
