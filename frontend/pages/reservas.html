<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condo Access - Reservas</title>
    <link href="https://fonts.googleapis.com/css?family=Jost:400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ---------- Felipe | HTML | Header e menu ---------- -->
    <header>
        <div class="menu-container">
            <div class="logo-titulo">CondoAccess</div>
            <nav class="menu">
                <a href="portaria.html">Portaria</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="moradores.html">Moradores</a>
                <a href="visitantes.html">Visitantes</a>
                <a href="historico.html">Histórico</a>
                <a href="reservas.html" class="ativo">Reservas</a>
            </nav>
        </div>
        <button class="botao-sair">Sair</button>
    </header>


        <main class="conteudo">
 <!-- ---------- Felipe | HTML | Título da página ---------- -->
        <div class="topo-pagina">
            <div>
                <h1>Reservas</h1>
                <p>Salão de festas, churrasqueira e quadra</p>
            </div>
        </div>
 <!-- ---------- Felipe | HTML | Seletor de área (cards gerados pelo mock.js) ---------- -->
        <div class="areas-grid" id="areas"></div>
 
        <section class="card">
            <h2>Nova reserva · <span id="areaSelecionadaNome">selecione uma área</span></h2>
            <form id="formReserva">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="morador">Morador</label>
                        <select id="morador" required></select>
                    </div>
                    <div class="form-group">
                        <label for="inicio">Início</label>
                        <input type="datetime-local" id="inicio" required>
                    </div>
                    <div class="form-group">
                        <label for="fim">Fim</label>
                        <input type="datetime-local" id="fim" required>
                    </div>
                </div>
                <div class="form-acoes">
                    <button type="submit" class="btn btn-primario">Reservar</button>
                </div>
            </form>
        </section>
 
        <section class="card">
             <!-- ---------- Felipe | HTML | Tabela ---------- -->
            <div class="tabela-container">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Morador</th>
                            <th>Área</th>
                            <th>Início</th>
                            <th>Fim</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaReservas"></tbody>
                </table>
            </div>
        </section>
 
    </main>
    <!-- Dados fictícios: vêm do js/mock.js (feito por outra pessoa do grupo) -->
    <script src="../js/mock.js"></script>
    <script>
        // ================= Felipe | JS | Dados =================
        // Usa do js/mock.js (formato do contrato-api.md):
        //   AREAS_MOCK:     { id, nome, capacidade }
        //   RESERVAS_MOCK:  { id, morador: "João Silva", areaComum: "Quadra", inicio, fim, status: "SOLICITADA"|"CONFIRMADA"|"CANCELADA" }
        //   MORADORES_MOCK: para o select de moradores e para saber quem está inadimplente
        // Se o mock.js não carregar, a página abre vazia, sem erro
        const areas = typeof AREAS_MOCK !== "undefined" ? AREAS_MOCK : [];
        const reservas = typeof RESERVAS_MOCK !== "undefined" ? RESERVAS_MOCK : [];
        const moradores = typeof MORADORES_MOCK !== "undefined" ? MORADORES_MOCK : [];
 
        // ================= Felipe | JS | Funções de apoio =================
        function proximoId(lista) {
            return lista.reduce((max, item) => Math.max(max, item.id), 0) + 1;
        }
        // "2026-11-10T18:00" -> "10/11/2026 18:00"
        function formatarDataHora(iso) {
            if (!iso) return "-";
            const [data, hora] = iso.split("T");
            const [ano, mes, dia] = data.split("-");
            return `${dia}/${mes}/${ano}${hora ? " " + hora.slice(0, 5) : ""}`;
        }
 // evita que texto vire HTML na tabela
        function esc(texto) {
            return String(texto ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }
        // toast: tipo = "sucesso" | "erro"
        function mostrarToast(mensagem, tipo = "sucesso") {
            let area = document.querySelector(".toast-area");
            if (!area) {
                area = document.createElement("div");
                area.className = "toast-area";
                document.body.appendChild(area);
            }
            const toast = document.createElement("div");
            toast.className = `toast toast-${tipo}`;
            toast.textContent = mensagem;
            area.appendChild(toast);
            setTimeout(() => toast.classList.add("saindo"), 3200);
            setTimeout(() => toast.remove(), 3600);
        }
        // ================= Felipe | JS | Página: reservas =================
        const areasContainer = document.getElementById("areas");
        const areaNome = document.getElementById("areaSelecionadaNome");
        const selectMorador = document.getElementById("morador");
        const form = document.getElementById("formReserva");
        const tabela = document.getElementById("tabelaReservas");
 
        const STATUS = {
            SOLICITADA: { texto: "Solicitada", classe: "badge-solicitada" },
            CONFIRMADA: { texto: "Confirmada", classe: "badge-confirmada" },
            CANCELADA:  { texto: "Cancelada",  classe: "badge-cancelada" }
        };
 
        let areaSelecionada = null; // nome da área, igual ao campo areaComum da reserva

        // ---------- Felipe | JS | cards de área ----------
        function renderizarAreas() {
            areasContainer.innerHTML = areas.map(a => `
                <button type="button" class="area-card ${a.nome === areaSelecionada ? "selecionada" : ""}" data-nome="${esc(a.nome)}">
                    <span class="area-nome">${esc(a.nome)}</span>
                    <span class="area-capacidade">Capacidade: ${a.capacidade} pessoas</span>
                </button>
            `).join("");
        }
         areasContainer.addEventListener("click", (e) => {
            const card = e.target.closest(".area-card");
            if (!card) return;
            areaSelecionada = card.dataset.nome;
            areaNome.textContent = areaSelecionada;
            renderizarAreas();
        });
         // ---------- Felipe | JS | select de moradores (só ativos) ----------
        selectMorador.innerHTML = `<option value="">Selecione o morador</option>` +
            moradores
                .filter(m => m.status === "ATIVO")
                .map(m => `<option value="${m.id}">${esc(m.nome)}${m.unidade ? " (" + esc(m.unidade.nome) + ")" : ""}</option>`)
                .join("");
                // ---------- Felipe | JS | regras de reserva ----------
 
        // RN04: conflita se sobrepõe uma reserva NÃO cancelada da mesma área
        function temConflito(areaComum, inicio, fim) {
            return reservas.some(r =>
                r.areaComum === areaComum &&
                r.status !== "CANCELADA" &&
                r.inicio < fim && inicio < r.fim
            );
        }
  form.addEventListener("submit", (e) => {
            e.preventDefault();
 
            const morador = moradores.find(m => m.id === Number(selectMorador.value));
            const inicio = document.getElementById("inicio").value;
            const fim = document.getElementById("fim").value;
 
            if (!areaSelecionada) {
                mostrarToast("Selecione uma área comum", "erro");
                return;
            }
            if (fim <= inicio) {
                mostrarToast("Período da reserva é inválido", "erro");
                return;
            }
            // MoradorInadimplente.podeReservar() -> taxaPendente <= 0
            if (morador.taxaPendente > 0) {
                mostrarToast(`${morador.nome} não pode reservar: há taxa pendente (inadimplente)`, "erro");
                return;
            }
            if (temConflito(areaSelecionada, inicio, fim)) {
                mostrarToast("Área comum já reservada nesse período", "erro");
                return;
            }
 
            reservas.push({
                id: proximoId(reservas),
                morador: morador.nome,
                areaComum: areaSelecionada,
                inicio,
                fim,
                status: "SOLICITADA"
            });
 
            mostrarToast(`Reserva de ${areaSelecionada} solicitada`);
            form.reset();
            renderizarTabela();
        });
         // ---------- Felipe | JS | tabela ----------
        function renderizarTabela() {
            if (reservas.length === 0) {
                tabela.innerHTML = `<tr><td colspan="6" class="vazio">Nenhuma reserva</td></tr>`;
                return;
            }
 
            const lista = [...reservas].sort((a, b) => a.inicio.localeCompare(b.inicio));
 
            tabela.innerHTML = lista.map(r => {
                const status = STATUS[r.status] || { texto: r.status, classe: "" };
                // RN06: só confirma o que está SOLICITADA | RN07: não cancela o que já está CANCELADA
                const podeConfirmar = r.status === "SOLICITADA";
                const podeCancelar = r.status !== "CANCELADA";
                return `
                    <tr>
                        <td>${esc(r.morador)}</td>
                        <td>${esc(r.areaComum)}</td>
                        <td>${formatarDataHora(r.inicio)}</td>
                        <td>${formatarDataHora(r.fim)}</td>
                        <td><span class="badge ${status.classe}">${esc(status.texto)}</span></td>
                        <td>
                            <div class="acoes">
                                <button class="btn btn-secundario btn-pequeno" data-acao="confirmar" data-id="${r.id}" ${podeConfirmar ? "" : "disabled"}>Confirmar</button>
                                <button class="btn btn-perigo btn-pequeno" data-acao="cancelar" data-id="${r.id}" ${podeCancelar ? "" : "disabled"}>Cancelar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join("");
        }
 tabela.addEventListener("click", (e) => {
            const botao = e.target.closest("button[data-acao]");
            if (!botao || botao.disabled) return;
            const reserva = reservas.find(r => r.id === Number(botao.dataset.id));
 
            if (botao.dataset.acao === "confirmar") {
                if (reserva.status !== "SOLICITADA") {
                    mostrarToast("Só é possível confirmar uma reserva solicitada", "erro");
                    return;
                }
                reserva.status = "CONFIRMADA";
                mostrarToast("Reserva confirmada");
            } else if (botao.dataset.acao === "cancelar") {
                if (reserva.status === "CANCELADA") {
                    mostrarToast("Reserva já está cancelada", "erro");
                    return;
                }
                reserva.status = "CANCELADA";
                mostrarToast("Reserva cancelada");
            }
            renderizarTabela();
        });
 
        renderizarAreas();
        renderizarTabela();
    </script>
</body>
</html>
